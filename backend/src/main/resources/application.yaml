server:
  # Render y Railway avisan en qué puerto escuchar con la variable PORT.
  # En local no existe, así que queda 8080 (o lo que pongas en SERVER_PORT).
  port: ${PORT:8080}

spring:
  web:
    error:
      # Incluye el texto del error (ej. "Pedido no encontrado") en las respuestas de error.
      # Sin esto, el front recibe el código (404, 409...) pero no el motivo.
      include-message: always